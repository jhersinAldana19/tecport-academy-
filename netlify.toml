# Netlify configuration for Tecport Academy

[build]
  # Build command
  command = "bun run build"
  # Output directory
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "18"

# Redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
